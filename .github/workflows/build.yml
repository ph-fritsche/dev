name: Build

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      variant:
        type: string
  workflow_dispatch:
    inputs:
      name:
        type: string
        required: true
      variant:
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    -
      name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    -
      name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ${{ vars.DOCKER_USER }}/dev-${{ inputs.name }}:${{ inputs.variant || 'latest' }}
        file: Dockerfile.${{ inputs.name }}${{ inputs.variant && format('.{0}', inputs.variant) }}
